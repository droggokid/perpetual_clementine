<style>
  #clementine-preview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 12px;
    max-width: 660px;
    padding: 16px;
    border-radius: 10px;
    background: #202631;
    color: #dbe5ef;
    font: 15px system-ui, sans-serif;
    text-align: center;
  }

  #clementine-preview figure { margin: 0; }
  #clementine-preview .detail { display: block; margin: 12px auto 16px; }
  #clementine-preview .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px;
    border-radius: 5px;
    background: #2d3440;
    color: #bcc8d5;
    font: 12px monospace;
  }

  #clementine-preview .bar canvas { width: 18px; height: 18px; }
</style>
<div id="clementine-preview">
  <figure>
    <figcaption>Current</figcaption>
    <canvas class="detail" data-icon="current" width="84" height="84" role="img" aria-label="Filled fruit with a leaf"></canvas>
    <div class="bar"><span>Monday 17:20</span><canvas data-icon="current" width="36" height="36" aria-hidden="true"></canvas><span aria-hidden="true">☼</span></div>
  </figure>
  <figure>
    <figcaption>Whole fruit outline</figcaption>
    <canvas class="detail" data-icon="outline" width="84" height="84" role="img" aria-label="Wide clementine outline with a tilted leaf"></canvas>
    <div class="bar"><span>Monday 17:20</span><canvas data-icon="outline" width="36" height="36" aria-hidden="true"></canvas><span aria-hidden="true">☼</span></div>
  </figure>
  <figure>
    <figcaption>Segmented slice</figcaption>
    <canvas class="detail" data-icon="slice" width="84" height="84" role="img" aria-label="Citrus cross-section with six wedges"></canvas>
    <div class="bar"><span>Monday 17:20</span><canvas data-icon="slice" width="36" height="36" aria-hidden="true"></canvas><span aria-hidden="true">☼</span></div>
  </figure>
</div>
<script>
  (() => {
    const preview = document.getElementById('clementine-preview');
    for (const canvas of preview.querySelectorAll('canvas')) {
      const ctx = canvas.getContext('2d');
      ctx.scale(canvas.width / 24, canvas.height / 24);
      ctx.strokeStyle = ctx.fillStyle = '#dbe5ef';
      ctx.lineWidth = 1.9;
      ctx.lineJoin = 'round';

      if (canvas.dataset.icon === 'current') {
        ctx.ellipse(12, 13.5, 10, 8.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.72;
        ctx.beginPath();
        ctx.moveTo(11, 6);
        ctx.quadraticCurveTo(12, 0, 20, 2);
        ctx.quadraticCurveTo(18, 8, 11, 6);
        ctx.fill();
      } else if (canvas.dataset.icon === 'outline') {
        const fruitPath = 'M12 7.5C8.5 6 4.3 7.4 2.8 11.2 1 15.9 5.1 21 11.7 21 17.8 21 22.4 17.7 21.6 13.1 21 9.4 17.3 6.4 12 7.5Z';
        const leafPath = 'M12 7.5C13.1 4.2 15.7 2.4 20.1 2.9 18.8 6.1 15.7 7.8 12 7.5Z';
        ctx.stroke(new Path2D(fruitPath + leafPath));
      } else {
        ctx.arc(12, 12, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        const segment = Math.PI / 3;
        const halfWedge = segment / 2 - 0.14;
        for (let index = 0; index < 6; index++) {
          const angle = index * segment;
          ctx.moveTo(12 + Math.cos(angle) * 1.5, 12 + Math.sin(angle) * 1.5);
          ctx.arc(12, 12, 7.25, angle - halfWedge, angle + halfWedge);
          ctx.closePath();
        }
        ctx.fill();
      }
    }
  })();
</script>
